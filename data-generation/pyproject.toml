[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-data-generation"
version = "1.0.0"
description = "Reproducible synthetic source generators for the Eve GTM contracts."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6",
  "duckdb>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
eve-data-generation = "eve_data_generation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
