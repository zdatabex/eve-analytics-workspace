version: 2

models:
  - name: stg_product__usage
    description: "One use of one AI workflow by one product login. The use is kept as recorded. Results of that use live on the product outcome row."
    columns:
      - name: product_usage_source_id
        description: "Product's id for this use."
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: product_user_source_id
        description: "Product's id for the product login that ran this use."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: "ref('stg_product__user')"
                field: product_user_source_id
      - name: product_firm_id
        description: "Product's id for the firm this use belongs to."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: "ref('stg_product__firm')"
                field: product_firm_id
      - name: product_workflow_id
        description: "Product's id for the AI workflow this use ran."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: "ref('stg_product__ai_workflow')"
                field: product_workflow_id
      - name: work_unit_count
        description: "The work counted on that use."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
              description: >
                work_unit_count is a whole number greater than or equal to 1.
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= floor(work_unit_count)"
              description: >
                work_unit_count is a whole number.
      - name: occurred_at
        description: "When the product login used the workflow."
        data_tests:
          - not_null
      - name: source_system
        description: "The sending system for this row, which is Product."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - product
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
