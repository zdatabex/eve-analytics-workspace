version: 2

models:
  - name: stg_product__user
    description: "One product login as Product recorded it at one time. A later status, firm, or email change is another row."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_user_source_id
              - observed_at
    columns:
      - name: product_user_source_id
        description: "Product's id for this product login, which is not a HubSpot contact and is not a billed seat."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: observed_at
        description: "When Product took this recording of the product login."
        data_tests:
          - not_null
      - name: product_firm_id
        description: "Product's id for the firm this product login belongs to."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: "ref('stg_product__firm')"
                field: product_firm_id
      - name: email_normalized
        description: "The product login's email, which can appear on more than one product login and on more than one HubSpot contact."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= lower(trim(email_normalized))"
              description: >
                When present, email_normalized equals its lowercase trimmed form.
      - name: status
        description: "Whether this product login is invited, active, or inactive."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - invited
                  - active
                  - inactive
      - name: source_system
        description: "The sending system for this row, which is Product."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - product
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
