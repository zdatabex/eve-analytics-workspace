version: 2

models:
  - name: stg_product__firm
    description: >
      Current Product firm staging interface over source('product', 'firm').
      One row is one Product firm. The unique key is product_firm_id. History
      stays current because the landed contract stores one current row, and
      this model does not collapse or version that row. Canonical identity,
      adoption, and metrics are not applied. Reconciliation exceptions: none.
    columns:
      - name: product_firm_id
        description: >
          Opaque Product firm identifier. Required non-empty string. This is
          the source identifier, not a canonical account surrogate, and not an
          adoption measure.
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: firm_name
        description: >
          Open string for the tenant name as Product records it. Required and
          non-empty. Not a canonical account attribute and not an adoption
          measure.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: primary_domain
        description: >
          Optional lowercase host used as Product's domain text. Null when
          Product has no domain. An empty string is invalid. When present, the
          value has no scheme, path, backslash, @, or whitespace. Duplicate
          domains stay. Not a canonical account key and not an adoption measure.
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: state
        description: >
          Optional open string for a US state. Null when absent. An empty
          string is invalid. Not a closed postal-code list, not a canonical
          account attribute, and not an adoption measure.
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: source_system
        description: >
          Ingestion metadata. The landed source system for every Product row.
          Not a canonical business attribute and not an adoption measure.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['product']
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: delivery_id
        description: >
          Ingestion metadata. Non-empty extraction batch id. Many rows may
          share one delivery_id. Not unique, not a canonical business
          attribute, and not an adoption measure.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: >
          Ingestion metadata. Timestamp when the delivery was accepted. It may
          be later than a business timestamp. Not a canonical business
          attribute and not an adoption measure.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              primary_domain is null
              or (
                primary_domain = lower(primary_domain)
                and strpos(primary_domain, '://') = 0
                and strpos(primary_domain, '/') = 0
                and strpos(primary_domain, chr(92)) = 0
                and strpos(primary_domain, '@') = 0
                and not regexp_matches(primary_domain, '\s')
              )

  - name: stg_product__user
    description: >
      Observation Product user staging interface over source('product', 'user').
      One row is one observation of one product user at one observed_at. The
      unique key is product_user_source_id and observed_at. This is not one
      current login and not an effective-dated version. Canonical identity,
      adoption, and metrics are not applied. Reconciliation exceptions: none.
    columns:
      - name: product_user_source_id
        description: >
          Opaque Product login identifier. Required non-empty string. Many
          observations can share one login id, so the column is not unique.
          Not a canonical product_user_id surrogate and not an adoption measure.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: email_normalized
        description: >
          Optional email. Null when the login has no email. When present, the
          value is lowercase, trimmed, and non-empty. Duplicate emails are
          valid, including across firms. Not a canonical contact key and not
          an adoption measure.
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= lower(trim(email_normalized))"
      - name: status
        description: >
          Product user status enum: invited, active, or inactive. Required.
          Status does not choose a lifecycle event. Not a canonical commercial
          status and not an adoption measure.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['invited', 'active', 'inactive']
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: observed_at
        description: >
          Observation timestamp. Part of the unique key with
          product_user_source_id. This source row is not a canonical Type 2
          version and not an adoption measure.
        data_tests:
          - not_null
      - name: product_firm_id
        description: >
          Relationship to the Product firm source identifier on this
          observation. Required non-empty string. A later observation may cite
          a different firm. Not a canonical account surrogate and not an
          adoption measure.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: ref('stg_product__firm')
                field: product_firm_id
      - name: source_system
        description: >
          Ingestion metadata. The landed source system for every Product row.
          Not a canonical business attribute and not an adoption measure.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['product']
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: delivery_id
        description: >
          Ingestion metadata. Non-empty extraction batch id. Many rows may
          share one delivery_id. Not unique, not a canonical business
          attribute, and not an adoption measure.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: >
          Ingestion metadata. Timestamp when the delivery was accepted. It may
          be later than observed_at. Not a canonical business attribute and
          not an adoption measure.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - product_user_source_id
              - observed_at

  - name: stg_product__ai_workflow
    description: >
      Current Product AI workflow staging interface over
      source('product', 'ai_workflow'). One row is one AI workflow. The unique
      key is product_workflow_id. History stays current because the landed
      contract stores one current row. Canonical identity, adoption, and
      metrics are not applied. Reconciliation exceptions: none.
    columns:
      - name: product_workflow_id
        description: >
          Opaque Product workflow identifier. Required non-empty string. Not a
          canonical ai_workflow_id surrogate and not an adoption measure.
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: workflow_code
        description: >
          Open catalog code, unique across workflows. Required non-empty
          string. The code list is not closed. Not a canonical workflow
          surrogate and not an adoption measure.
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: workflow_name
        description: >
          Open text capability name. Required and non-empty. Not a canonical
          attribute and not an adoption measure.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: source_system
        description: >
          Ingestion metadata. The landed source system for every Product row.
          Not a canonical business attribute and not an adoption measure.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['product']
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: delivery_id
        description: >
          Ingestion metadata. Non-empty extraction batch id. Many rows may
          share one delivery_id. Not unique, not a canonical business
          attribute, and not an adoption measure.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: >
          Ingestion metadata. Timestamp when the delivery was accepted. Not a
          canonical business attribute and not an adoption measure.
        data_tests:
          - not_null

  - name: stg_product__usage
    description: >
      Immutable Product usage staging interface over source('product', 'usage').
      One row is one usage of one AI workflow by one product user. The unique
      key is product_usage_source_id. Usage is not copied onto a lifecycle
      event. Canonical identity, adoption, and metrics are not applied.
      Reconciliation exceptions: none.
    columns:
      - name: product_usage_source_id
        description: >
          Opaque Product usage identifier. Required non-empty string. Not a
          canonical product_usage_id surrogate and not an adoption measure.
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: occurred_at
        description: >
          Timestamp when the usage run happened. Required. Distinct from
          ingested_at. Not an adoption timestamp.
        data_tests:
          - not_null
      - name: work_unit_count
        description: >
          Integer measure of work units on the run. Minimum 1. A single run
          may be 1. Not an adoption score, not a commercial amount, and not a
          canonical metric.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= floor(work_unit_count)"
      - name: product_user_source_id
        description: >
          Relationship to the Product user source identifier. Required
          non-empty string. The user key is not unique across observations.
          Not a canonical product user surrogate and not an adoption measure.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: ref('stg_product__user')
                field: product_user_source_id
      - name: product_firm_id
        description: >
          Relationship to the Product firm source identifier cited for this
          usage. Required non-empty string. Not a canonical account surrogate
          and not an adoption measure.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: ref('stg_product__firm')
                field: product_firm_id
      - name: product_workflow_id
        description: >
          Relationship to the Product workflow source identifier. Required
          non-empty string. Not a canonical workflow surrogate and not an
          adoption measure.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: ref('stg_product__ai_workflow')
                field: product_workflow_id
      - name: source_system
        description: >
          Ingestion metadata. The landed source system for every Product row.
          Not a canonical business attribute and not an adoption measure.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['product']
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: delivery_id
        description: >
          Ingestion metadata. Non-empty extraction batch id. Many rows may
          share one delivery_id. Not unique, not a canonical business
          attribute, and not an adoption measure.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: >
          Ingestion metadata. Timestamp when the delivery was accepted. It may
          be later than occurred_at. Not a canonical business attribute and
          not an adoption measure.
        data_tests:
          - not_null

  - name: stg_product__outcome
    description: >
      Immutable Product outcome staging interface over
      source('product', 'outcome'). One row is one outcome of one product
      usage event. The unique key is product_outcome_source_id. The model does
      not identify an account's first outcome. Canonical identity, adoption,
      and metrics are not applied. Reconciliation exceptions: none.
    columns:
      - name: product_outcome_source_id
        description: >
          Opaque Product outcome identifier. Required non-empty string. Not a
          canonical product_outcome_id surrogate and not an adoption measure.
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: occurred_at
        description: >
          Timestamp when the outcome completed. Required, and at or after the
          cited usage occurred_at. Not an adoption timestamp.
        data_tests:
          - not_null
      - name: outcome_type
        description: >
          Outcome type enum: draft_completed, review_accepted, or exported.
          Required. Not adoption_reached and not an adoption score.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['draft_completed', 'review_accepted', 'exported']
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: product_usage_source_id
        description: >
          Relationship to the cited Product usage source identifier. Required
          non-empty string and unique among outcomes. Not a canonical usage
          surrogate and not an adoption measure.
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: ref('stg_product__usage')
                field: product_usage_source_id
      - name: product_user_source_id
        description: >
          Relationship to the Product user source identifier on the cited
          usage. Required non-empty string. Not a canonical product user
          surrogate and not an adoption measure.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: ref('stg_product__user')
                field: product_user_source_id
      - name: product_firm_id
        description: >
          Relationship to the Product firm source identifier on the cited
          usage. Required non-empty string. Not a canonical account surrogate
          and not an adoption measure.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: ref('stg_product__firm')
                field: product_firm_id
      - name: product_workflow_id
        description: >
          Relationship to the Product workflow source identifier on the cited
          usage. Required non-empty string. Not a canonical workflow surrogate
          and not an adoption measure.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: ref('stg_product__ai_workflow')
                field: product_workflow_id
      - name: source_system
        description: >
          Ingestion metadata. The landed source system for every Product row.
          Not a canonical business attribute and not an adoption measure.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['product']
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: delivery_id
        description: >
          Ingestion metadata. Non-empty extraction batch id. Many rows may
          share one delivery_id. Not unique, not a canonical business
          attribute, and not an adoption measure.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: >
          Ingestion metadata. Timestamp when the delivery was accepted. It may
          be later than occurred_at. Not a canonical business attribute and
          not an adoption measure.
        data_tests:
          - not_null
