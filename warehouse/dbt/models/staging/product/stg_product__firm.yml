version: 2

models:
  - name: stg_product__firm
    description: "One firm as Product currently stores that tenant. A correction replaces the firm record."
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              primary_domain is null or ( primary_domain = lower(primary_domain) and
              strpos(primary_domain, '://') = 0 and strpos(primary_domain, '/') = 0 and
              strpos(primary_domain, chr(92)) = 0 and strpos(primary_domain, '@') = 0 and
              not regexp_matches(primary_domain, '\s') )
          description: >
            When present, primary_domain is lowercase and contains neither a scheme, a
            path, a backslash, an at sign, nor whitespace.
    columns:
      - name: product_firm_id
        description: "Product's id for this firm."
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: firm_name
        description: "The firm name in Product's own wording, which may differ from the HubSpot company and can appear on more than one source record."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: primary_domain
        description: "The firm's web address as Product stored it, which can appear on more than one source record."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: state
        description: "The US state in Product's own wording."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: source_system
        description: "The sending system for this row, which is Product."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - product
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
