version: 2

models:
  - name: stg_product__ai_workflow
    description: "One AI workflow as Product currently stores it. A correction replaces that workflow."
    columns:
      - name: product_workflow_id
        description: "Product's id for this AI workflow."
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: workflow_code
        description: "The workflow code a person would read on this workflow."
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: workflow_name
        description: "The workflow name in Product's own wording."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: source_system
        description: "The sending system for this row, which is Product."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - product
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
