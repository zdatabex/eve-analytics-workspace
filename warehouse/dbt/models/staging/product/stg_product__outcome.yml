version: 2

models:
  - name: stg_product__outcome
    description: "One result of one product use. The result is kept as recorded."
    columns:
      - name: product_outcome_source_id
        description: "Product's id for this result."
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: product_usage_source_id
        description: "Product's id for the use this result came from."
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: "ref('stg_product__usage')"
                field: product_usage_source_id
      - name: product_user_source_id
        description: "Product's id for the product login on that use."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: "ref('stg_product__user')"
                field: product_user_source_id
      - name: product_firm_id
        description: "Product's id for the firm on that use."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: "ref('stg_product__firm')"
                field: product_firm_id
      - name: product_workflow_id
        description: "Product's id for the AI workflow on that use."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: "ref('stg_product__ai_workflow')"
                field: product_workflow_id
      - name: outcome_type
        description: "What this result was: draft completed, review accepted, or exported."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - draft_completed
                  - review_accepted
                  - exported
      - name: occurred_at
        description: "When this result was recorded."
        data_tests:
          - not_null
      - name: source_system
        description: "The sending system for this row, which is Product."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - product
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
