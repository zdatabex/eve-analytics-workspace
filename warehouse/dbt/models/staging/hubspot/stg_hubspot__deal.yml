version: 2

models:
  - name: stg_hubspot__deal
    description: "One HubSpot deal as HubSpot recorded it at one time. A later recording of the same deal is another row even when the stage stays the same. Contract value lives on the DealHub contract, booking amount lives on DealHub bookings, and the repeating charge lives on the DealHub subscription."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - hubspot_deal_id
              - observed_at
      - dbt_utils.expression_is_true:
          arguments:
            expression: 'observed_at >= created_at'
          description: >
            observed_at is at or after created_at.
      - dbt_utils.expression_is_true:
          arguments:
            expression: 'amount is null or amount >= 0'
          description: >
            amount is null or greater than or equal to zero.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              ( opportunity_type = 'new_business' and dealhub_subscription_id is null ) or (
              opportunity_type in ('expansion', 'renewal') and dealhub_subscription_id is
              not null and dealhub_subscription_id <> '' )
          description: >
            new_business has a null dealhub_subscription_id, and expansion and renewal
            have a non-empty dealhub_subscription_id.
    columns:
      - name: hubspot_deal_id
        description: "HubSpot's id for this deal."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: observed_at
        description: "When HubSpot took this recording of the deal."
        data_tests:
          - not_null
      - name: hubspot_company_id
        description: "HubSpot's id for the firm this deal belongs to."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: 'ref("stg_hubspot__company")'
                field: hubspot_company_id
      - name: hubspot_contact_id
        description: "HubSpot's id for the contact this deal names."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: 'ref("stg_hubspot__contact")'
                field: hubspot_contact_id
      - name: hubspot_lead_id
        description: "HubSpot's id for the lead this deal came from."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: 'ref("stg_hubspot__lead")'
                field: hubspot_lead_id
      - name: dealhub_subscription_id
        description: "DealHub's id for the subscription an expansion or renewal targets, which new business leaves blank."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: opportunity_name
        description: "The deal name in HubSpot's own wording."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: opportunity_type
        description: "Whether this deal is new business, expansion, or renewal."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - new_business
                  - expansion
                  - renewal
      - name: stage
        description: "Where this deal stands: discovery, evaluation, proposal, negotiation, closed won, or closed lost."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - discovery
                  - evaluation
                  - proposal
                  - negotiation
                  - closed_won
                  - closed_lost
      - name: owner_name
        description: "The deal owner HubSpot named, a separate owner from the firm-relationship owner, and the two may match or differ."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: forecast_category
        description: "How HubSpot forecasts this deal: pipeline, best case, commit, closed, or omitted."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - pipeline
                  - best_case
                  - commit
                  - closed
                  - omitted
      - name: emitted_event
        description: "The deal signal HubSpot stored is opened, stage changed, won, or lost, and it is blank on a later recording whose stage stayed the same."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - opportunity_opened
                  - opportunity_stage_changed
                  - opportunity_won
                  - opportunity_lost
      - name: amount
        description: "The deal amount in US dollars, which stays blank when HubSpot left it blank."
      - name: expected_close_date
        description: "The date HubSpot expects the deal to close, a separate date from the contract start, and the two may match or differ."
      - name: created_at
        description: "When HubSpot created the deal."
        data_tests:
          - not_null
      - name: source_system
        description: "The sending system for this row, which is HubSpot."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - hubspot
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
