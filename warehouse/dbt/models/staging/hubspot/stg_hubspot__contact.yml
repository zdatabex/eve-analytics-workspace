version: 2

models:
  - name: stg_hubspot__contact
    description: "One HubSpot contact as HubSpot recorded that person at one time. A later recording of the same contact is another row."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - hubspot_contact_id
              - observed_at
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              email_normalized is null or email_normalized = lower(trim(email_normalized))
          description: >
            When present, email_normalized equals its lowercase trimmed form.
    columns:
      - name: hubspot_contact_id
        description: "HubSpot's id for this contact."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: observed_at
        description: "When HubSpot took this recording of the contact."
        data_tests:
          - not_null
      - name: hubspot_company_id
        description: "HubSpot's id for the firm this contact belongs to."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: 'ref("stg_hubspot__company")'
                field: hubspot_company_id
      - name: full_name
        description: "The contact's name in HubSpot's own wording."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: email_normalized
        description: "The contact's email, which can appear on more than one HubSpot contact and on more than one product login."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: title
        description: "The contact's job title in HubSpot's own wording."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: buying_role
        description: "The contact's part in the purchase: champion, decision maker, user, or billing."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - champion
                  - decision_maker
                  - user
                  - billing
      - name: source_system
        description: "The sending system for this row, which is HubSpot."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - hubspot
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
