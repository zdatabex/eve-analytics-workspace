version: 2

models:
  - name: stg_hubspot__company
    description: "One HubSpot company as HubSpot recorded it at one time. A later recording of the same company is another row. Deal amount lives on the HubSpot deal, contract value lives on the DealHub contract, and booking amount lives on DealHub bookings."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - hubspot_company_id
              - observed_at
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              primary_domain is null or ( primary_domain = lower(trim(primary_domain)) and
              position('://' in primary_domain) = 0 and position('/' in primary_domain) = 0
              )
          description: >
            When present, primary_domain is lowercase and trimmed and contains neither a
            scheme nor a path.
    columns:
      - name: hubspot_company_id
        description: "HubSpot's id for this company."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: observed_at
        description: "When HubSpot took this recording of the company."
        data_tests:
          - not_null
      - name: firm_name
        description: "The company name in HubSpot's own wording, which can appear on more than one source record."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: primary_domain
        description: "The company's web address as HubSpot stored it, which can appear on more than one source record."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: state
        description: "The US state in HubSpot's own wording."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: segment
        description: "The company size HubSpot recorded: solo, small, mid, or large."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - solo
                  - small
                  - mid
                  - large
      - name: practice_focus
        description: "The practice focus in HubSpot's own wording."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: icp_fit
        description: "Whether this company is in the ideal customer profile, or outside it."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - in_icp
                  - out_of_icp
      - name: owner_name
        description: "The firm-relationship owner HubSpot named, a separate owner from the deal owner, and the two may match or differ."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: hubspot_lifecycle_stage
        description: "HubSpot's own lifecycle label, and those words are not limited to prospect, customer, or former customer."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: source_system
        description: "The sending system for this row, which is HubSpot."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - hubspot
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
