version: 2

models:
  - name: stg_hubspot__activity
    description: "One HubSpot call, email, or meeting. The activity is kept as recorded and can name a firm, a contact, a lead, a deal, or more than one of those."
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              hubspot_company_id is not null or hubspot_contact_id is not null or
              hubspot_lead_id is not null or hubspot_deal_id is not null
          description: >
            The activity has at least one of hubspot_company_id, hubspot_contact_id,
            hubspot_lead_id, and hubspot_deal_id.
    columns:
      - name: hubspot_activity_id
        description: "HubSpot's id for this activity."
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: hubspot_company_id
        description: "HubSpot's id for a firm this activity names."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: 'ref("stg_hubspot__company")'
                field: hubspot_company_id
      - name: hubspot_contact_id
        description: "HubSpot's id for a contact this activity names."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: 'ref("stg_hubspot__contact")'
                field: hubspot_contact_id
      - name: hubspot_lead_id
        description: "HubSpot's id for a lead this activity names."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: 'ref("stg_hubspot__lead")'
                field: hubspot_lead_id
      - name: hubspot_deal_id
        description: "HubSpot's id for a deal this activity names."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: 'ref("stg_hubspot__deal")'
                field: hubspot_deal_id
      - name: activity_type
        description: "Whether this activity is a call, an email, or a meeting."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - call
                  - email
                  - meeting
      - name: subject
        description: "The activity subject in HubSpot's own wording."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: occurred_at
        description: "When the call, email, or meeting happened."
        data_tests:
          - not_null
      - name: source_system
        description: "The sending system for this row, which is HubSpot."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - hubspot
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
