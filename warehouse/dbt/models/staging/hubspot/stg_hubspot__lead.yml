version: 2

models:
  - name: stg_hubspot__lead
    description: "One HubSpot lead as HubSpot recorded its status at one time. A later status is another row."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - hubspot_lead_id
              - observed_at
      - dbt_utils.expression_is_true:
          arguments:
            expression: 'observed_at >= created_at'
          description: >
            observed_at is at or after created_at.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (status = 'working' and emitted_event is null) or (status = 'qualified' and
              emitted_event = 'lead_qualified') or (status = 'disqualified' and
              emitted_event = 'lead_disqualified') or (status = 'converted' and
              emitted_event = 'lead_converted') or status = 'new'
          description: >
            status and emitted_event stay paired, including working with a null event and
            new allowed by this predicate.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              ( emitted_event = 'lead_converted' and hubspot_deal_id is not null ) or (
              coalesce(emitted_event, '') <> 'lead_converted' and hubspot_deal_id is null )
          description: >
            hubspot_deal_id is present only on lead_converted.
    columns:
      - name: hubspot_lead_id
        description: "HubSpot's id for this lead."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: observed_at
        description: "When HubSpot took this recording of the lead."
        data_tests:
          - not_null
      - name: hubspot_company_id
        description: "HubSpot's id for the firm this lead names."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: 'ref("stg_hubspot__company")'
                field: hubspot_company_id
      - name: hubspot_contact_id
        description: "HubSpot's id for the contact this lead names."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: 'ref("stg_hubspot__contact")'
                field: hubspot_contact_id
      - name: hubspot_deal_id
        description: "HubSpot's id for the deal, present only on the converted observation and blank otherwise."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: 'ref("stg_hubspot__deal")'
                field: hubspot_deal_id
      - name: marketing_campaign_id
        description: "Marketing's id for the campaign this lead came from."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: status
        description: "Where this lead stands: new, working, qualified, disqualified, or converted."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - new
                  - working
                  - qualified
                  - disqualified
                  - converted
      - name: emitted_event
        description: "The lead signal HubSpot stored is created, qualified, disqualified, or converted, and it is blank while the lead is working."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - lead_created
                  - lead_qualified
                  - lead_disqualified
                  - lead_converted
      - name: created_at
        description: "When HubSpot created the lead."
        data_tests:
          - not_null
      - name: source_system
        description: "The sending system for this row, which is HubSpot."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - hubspot
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
