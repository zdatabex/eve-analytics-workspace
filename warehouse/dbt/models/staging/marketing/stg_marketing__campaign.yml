version: 2

models:
  - name: stg_marketing__campaign
    description: "One marketing campaign per row. A channel change replaces the previous channel. Daily spend and results are on campaign performance."
    columns:
      - name: marketing_campaign_id
        description: "Marketing's id for this campaign."
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: campaign_code
        description: "The campaign code a person would read on this campaign."
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: campaign_name
        description: "The campaign name in Marketing's own wording."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: channel
        description: "How this campaign reaches people: paid search, paid social, email, webinar, partner, or outbound."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - paid_search
                  - paid_social
                  - email
                  - webinar
                  - partner
                  - outbound
      - name: source_system
        description: "The sending system for this row, which is Marketing."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - marketing
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
