version: 2

models:
  - name: stg_marketing__touch
    description: "One attribution touch Marketing recorded. The touch is kept as recorded and can name a contact, a lead, a firm, or more than one."
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              hubspot_contact_id is not null or hubspot_lead_id is not null or
              hubspot_company_id is not null
          description: >
            The touch has at least one of hubspot_contact_id, hubspot_lead_id, and
            hubspot_company_id.
    columns:
      - name: marketing_touch_source_id
        description: "Marketing's id for this attribution touch."
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: marketing_campaign_id
        description: "Marketing's id for the campaign this touch belongs to."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: "ref('stg_marketing__campaign')"
                field: marketing_campaign_id
      - name: hubspot_contact_id
        description: "HubSpot's id for a contact this touch names."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: hubspot_lead_id
        description: "HubSpot's id for a lead this touch names."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: hubspot_company_id
        description: "HubSpot's id for a firm this touch names."
        data_tests:
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: occurred_at
        description: "When the touch happened."
        data_tests:
          - not_null
      - name: source_system
        description: "The sending system for this row, which is Marketing."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - marketing
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
