version: 2

models:
  - name: stg_marketing__campaign_performance
    description: "One marketing campaign on one calendar day. A correction replaces that day's spend, impressions, and clicks."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - marketing_campaign_id
              - performance_date
    columns:
      - name: marketing_campaign_id
        description: "Marketing's id for the campaign this day belongs to."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: "ref('stg_marketing__campaign')"
                field: marketing_campaign_id
      - name: performance_date
        description: "The calendar day these campaign results cover."
        data_tests:
          - not_null
      - name: spend_amount
        description: "That day's spend in US dollars, which stays blank when Marketing left it blank."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
              description: >
                spend_amount is greater than or equal to zero when present, and null stays
                null.
      - name: impression_count
        description: "The impressions counted for that campaign day, which stay blank when Marketing left them blank."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
              description: >
                impression_count is greater than or equal to zero when present, and null stays
                null.
      - name: click_count
        description: "The clicks counted for that campaign day, which can exceed impressions and stay blank when Marketing left them blank."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
              description: >
                click_count is greater than or equal to zero when present, and null stays
                null.
      - name: source_system
        description: "The sending system for this row, which is Marketing."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - marketing
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
