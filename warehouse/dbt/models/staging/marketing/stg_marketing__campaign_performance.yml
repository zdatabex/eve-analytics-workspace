version: 2

models:
  - name: stg_marketing__campaign_performance
    description: >
      One Marketing campaign on one calendar day. The grain is one campaign on one
      day, keyed by marketing_campaign_id and performance_date. History class is
      immutable: a correction replaces that campaign-day in the landed table, and
      this model does not version it. There is no separate performance document id.
      Read from source('marketing', 'campaign_performance'). Downstream models ref()
      this relation. renamed selects each landed column with no expression.
      Canonical identity, attribution logic, and metrics are absent. Measures are
      not summed onto the campaign. spend_amount stays on this source, it is not a
      HubSpot amount or a DealHub amount, and a null spend is not zero.
      source_system, delivery_id, and ingested_at are delivery metadata and are not
      part of the grain key. Late ingested_at is valid. Reconciliation exceptions:
      none.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - marketing_campaign_id
              - performance_date
    columns:
      - name: marketing_campaign_id
        description: >
          Campaign source identifier. It references
          stg_marketing__campaign.marketing_campaign_id. Not a canonical campaign_id. A
          required string is present and not empty. A missing campaign fails the
          relationship test and stays in this view.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: "ref('stg_marketing__campaign')"
                field: marketing_campaign_id
      - name: performance_date
        description: >
          Delivery day as a calendar date. Distinct from ingested_at. Part of the
          campaign-day key with marketing_campaign_id.
        data_tests:
          - not_null
      - name: spend_amount
        description: >
          That day's spend in US dollars. There is no currency field. Null means the
          source did not report it. Null is not zero. When present, the amount is
          greater than or equal to zero and stays at two fraction digits. This amount is
          not a HubSpot amount, a DealHub amount, or a campaign attribute.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
              description: >
                spend_amount is greater than or equal to zero when present, and null stays
                null.
      - name: impression_count
        description: >
          That day's impressions. Null means the source did not report it. Null is not
          zero. When present, the count is a whole number greater than or equal to zero.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
              description: >
                impression_count is greater than or equal to zero when present, and null stays
                null.
      - name: click_count
        description: >
          That day's clicks. Null means the source did not report it. Null is not zero.
          When present, the count is a whole number greater than or equal to zero.
          Clicks may exceed impressions.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
              description: >
                click_count is greater than or equal to zero when present, and null stays
                null.
      - name: source_system
        description: >
          Delivery metadata. The value is marketing. Not a business attribute and not
          part of the campaign-day key.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - marketing
      - name: delivery_id
        description: >
          Extraction batch that landed this row. Not part of the campaign-day key. A
          required string is present and not empty.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: >
          When the delivery was accepted, in UTC as landed. Distinct from
          performance_date. Late delivery is valid.
        data_tests:
          - not_null
