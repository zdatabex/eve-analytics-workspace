version: 2

models:
  - name: stg_dealhub__booking
    description: "One booking DealHub recognized. The booking is kept as recorded. Deal amount and the repeating charge stay on the HubSpot deal and the DealHub subscription."
    columns:
      - name: dealhub_booking_id
        description: "DealHub's id for this booking."
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: dealhub_contract_id
        description: "DealHub's id for the contract this booking cites."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: "ref('stg_dealhub__contract')"
                field: dealhub_contract_id
      - name: dealhub_subscription_id
        description: "DealHub's id for the subscription this booking cites."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: "ref('stg_dealhub__subscription')"
                field: dealhub_subscription_id
      - name: hubspot_company_id
        description: "HubSpot's id for the firm this booking names."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: hubspot_deal_id
        description: "HubSpot's id for the deal this booking names."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: booking_number
        description: "The booking number a person would read on this booking."
        data_tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: booking_type
        description: "Whether this booking is new business, expansion, or renewal."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - new_business
                  - expansion
                  - renewal
      - name: booking_amount
        description: "The booking amount in US dollars."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: '>= 0'
              description: >
                booking_amount is greater than or equal to zero.
      - name: booked_at
        description: "When DealHub recognized the booking."
        data_tests:
          - not_null
      - name: source_system
        description: "The sending system for this row, which is DealHub."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - dealhub
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
