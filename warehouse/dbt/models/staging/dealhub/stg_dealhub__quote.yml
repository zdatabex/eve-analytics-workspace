version: 2

models:
  - name: stg_dealhub__quote
    description: "One DealHub quote as DealHub recorded it at one time. A later status or quoted price is another row. Contract value lives on the DealHub contract."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - dealhub_quote_id
              - observed_at
      - dbt_utils.expression_is_true:
          arguments:
            expression: "status = 'draft' or quoted_amount is not null"
          description: >
            A null quoted_amount is allowed when status is draft.
    columns:
      - name: dealhub_quote_id
        description: "DealHub's id for this quote."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: observed_at
        description: "When DealHub took this recording of the quote."
        data_tests:
          - not_null
      - name: hubspot_deal_id
        description: "HubSpot's id for the deal this quote proposes."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: hubspot_company_id
        description: "HubSpot's id for the firm this quote names."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: quote_number
        description: "The quote number a person would read on this quote."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: status
        description: "Where this quote stands: draft, sent, accepted, rejected, or expired."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - draft
                  - sent
                  - accepted
                  - rejected
                  - expired
      - name: quoted_amount
        description: "The quoted price in US dollars, which stays blank when DealHub left it blank, including on a draft quote."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: '>= 0'
              description: >
                quoted_amount is greater than or equal to zero when present.
      - name: source_system
        description: "The sending system for this row, which is DealHub."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - dealhub
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
