version: 2

models:
  - name: stg_dealhub__quote
    description: >
      One observation of one DealHub quote. The grain is one observation of one
      DealHub quote, keyed by dealhub_quote_id and observed_at. History is
      observation: the same dealhub_quote_id stays on a later row when observed_at
      changes, and every landed row is kept. Read from source('dealhub', 'quote').
      Downstream models ref() this relation. renamed selects each landed column with
      no expression. The row is a source observation, not a canonical quote.
      quoted_amount stays the proposal amount on this row. It is not a booking
      amount and not ARR, and a null quoted_amount stays null. HubSpot identifiers
      stay unresolved, and staging does not look them up. source_system,
      delivery_id, and ingested_at are delivery metadata and are not part of the
      grain key. Late ingested_at is valid. Reconciliation exceptions: none.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - dealhub_quote_id
              - observed_at
      - dbt_utils.expression_is_true:
          arguments:
            expression: "status = 'draft' or quoted_amount is not null"
          description: >
            A null quoted_amount is allowed when status is draft.
    columns:
      - name: dealhub_quote_id
        description: >
          Opaque DealHub identifier for the quote. The same identifier repeats on a
          later observed_at. Part of the observation key. Not a canonical surrogate key,
          and staging does not reject a value for its shape.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: observed_at
        description: >
          When DealHub recorded this observation of the quote. With dealhub_quote_id it
          identifies the observation. It is not effective_start, and a later timestamp
          is another observation.
        data_tests:
          - not_null
      - name: hubspot_deal_id
        description: >
          HubSpot deal identifier the quote cites. Stored as the source identifier
          DealHub recorded. Not resolved to a canonical opportunity, and this model does
          not read HubSpot.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: hubspot_company_id
        description: >
          HubSpot company identifier the quote cites. Stored as the source identifier
          DealHub recorded. Not resolved to a canonical account. A contract that cites
          this quote uses the same company identifier.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: quote_number
        description: >
          Document number DealHub assigned to this quote. Stable across observations of
          one dealhub_quote_id and exclusive to that identifier. Not a surrogate key.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: status
        description: >
          Quote status DealHub stored on this observation. Closed to draft, sent,
          accepted, rejected, and expired. A draft may omit quoted_amount. Later
          statuses may not.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - draft
                  - sent
                  - accepted
                  - rejected
                  - expired
      - name: quoted_amount
        description: >
          Proposal amount on this observation, in US dollars with at most two fraction
          digits. Not a booking amount, not the contract value, and not ARR. Null is
          allowed while status is draft. A missing amount stays null.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: '>= 0'
              description: >
                quoted_amount is greater than or equal to zero when present.
      - name: source_system
        description: >
          Delivery metadata identifying the landing source. The value is dealhub. It is
          not a business attribute and it is not part of the observation key.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - dealhub
      - name: delivery_id
        description: >
          Extraction batch that landed this row. Not a business attribute and not part
          of the observation key. Many observations may share one delivery, and a replay
          uses a new delivery_id.
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: >
          When the platform accepted this delivery. Not a business attribute and not
          part of the observation key. A value later than observed_at is a valid late
          delivery.
        data_tests:
          - not_null
