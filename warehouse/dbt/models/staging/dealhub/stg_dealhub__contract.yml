version: 2

models:
  - name: stg_dealhub__contract
    description: "One DealHub contract as DealHub recorded it at one time. A later change to status, value, or dates is another row. The repeating charge lives on the DealHub subscription."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - dealhub_contract_id
              - observed_at
      - dbt_utils.expression_is_true:
          arguments:
            expression: 'end_date >= start_date'
          description: >
            end_date is at or after start_date.
    columns:
      - name: dealhub_contract_id
        description: "DealHub's id for this contract."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: observed_at
        description: "When DealHub took this recording of the contract."
        data_tests:
          - not_null
      - name: dealhub_quote_id
        description: "DealHub's id for the quote this contract accepts."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: "ref('stg_dealhub__quote')"
                field: dealhub_quote_id
      - name: hubspot_deal_id
        description: "HubSpot's id for the deal this contract names."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: hubspot_company_id
        description: "HubSpot's id for the firm this contract names."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: contract_number
        description: "The contract number a person would read on this contract."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: status
        description: "Where this contract stands: active, expired, or terminated."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - active
                  - expired
                  - terminated
      - name: total_contract_value
        description: "The contract value in US dollars."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: '>= 0'
              description: >
                total_contract_value is greater than or equal to zero.
      - name: start_date
        description: "The date the contract starts, a separate date from the expected close date, and the two may match or differ."
        data_tests:
          - not_null
      - name: end_date
        description: "The date the contract ends."
        data_tests:
          - not_null
      - name: source_system
        description: "The sending system for this row, which is DealHub."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - dealhub
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
