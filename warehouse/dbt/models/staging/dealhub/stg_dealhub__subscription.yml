version: 2

models:
  - name: stg_dealhub__subscription
    description: "One DealHub subscription as DealHub recorded it at one time. A renewal or an expansion can be recorded while the subscription stays active. Booking amount lives on DealHub bookings."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - dealhub_subscription_id
              - observed_at
      - dbt_utils.expression_is_true:
          arguments:
            expression: 'term_end >= term_start'
          description: >
            term_end is at or after term_start.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (status = 'pending' and emitted_event is null) or (status = 'active' and
              (emitted_event is null or emitted_event in ('subscription_renewed',
              'subscription_expanded'))) or (status = 'churned' and emitted_event =
              'subscription_churned')
          description: >
            pending has a null event, active has a null event or subscription_renewed or
            subscription_expanded, and churned has subscription_churned.
    columns:
      - name: dealhub_subscription_id
        description: "DealHub's id for this subscription."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: observed_at
        description: "When DealHub took this recording of the subscription."
        data_tests:
          - not_null
      - name: dealhub_contract_id
        description: "DealHub's id for the contract that grants this subscription."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
          - relationships:
              arguments:
                to: "ref('stg_dealhub__contract')"
                field: dealhub_contract_id
      - name: hubspot_company_id
        description: "HubSpot's id for the firm this subscription bills."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: subscription_number
        description: "The subscription number a person would read on this subscription."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: status
        description: "Where this subscription stands: pending, active, or churned."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pending
                  - active
                  - churned
      - name: plan_code
        description: "The plan code in DealHub's own wording."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: billing_frequency
        description: "How often the repeating charge is billed: monthly, quarterly, or annual."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - monthly
                  - quarterly
                  - annual
      - name: emitted_event
        description: "The subscription signal DealHub stored is renewed, expanded, or churned, and it is blank while pending and blank on an active subscription that is not a renewal or expansion."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - subscription_renewed
                  - subscription_expanded
                  - subscription_churned
      - name: seat_count
        description: "The seats billed on this subscription."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: '>= 0'
              description: >
                seat_count is greater than or equal to zero.
      - name: recurring_amount
        description: "The repeating charge in US dollars for the billing period."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: '>= 0'
              description: >
                recurring_amount is greater than or equal to zero.
      - name: term_start
        description: "The date this subscription term starts."
        data_tests:
          - not_null
      - name: term_end
        description: "The date this subscription term ends."
        data_tests:
          - not_null
      - name: source_system
        description: "The sending system for this row, which is DealHub."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - dealhub
      - name: delivery_id
        description: "The delivery batch this row arrived in, shared with the other rows in that batch."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string:
              arguments:
                trim_whitespace: false
      - name: ingested_at
        description: "When this delivery was accepted, which can be later than the business time on the row."
        data_tests:
          - not_null
