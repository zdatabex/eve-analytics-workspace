id: dealhub.contract
title: 'DealHub contract'
source_system: dealhub
source_entity: contract
canonical_entity: contract
history: observation
grain: 'One row represents one observation of one DealHub contract at one observed_at.'
source_identifier:
  - dealhub_contract_id
observation_key:
  - dealhub_contract_id
  - observed_at
fields:
  - name: dealhub_contract_id
    type: string
    nullable: false
    maps_to: contract.dealhub_contract_id
    description: 'Opaque non-empty source identifier issued by the source system. Not a canonical surrogate key. The contract accepts any non-empty string and does not reject a value solely for its shape. DealHub identifiers are expected to be prefixed strings. That shape is an assumption, not a rejection rule.'
  - name: contract_number
    type: string
    nullable: false
    maps_to: contract.contract_number
    description: 'Required document number. Stable across observations of the same source identifier and unique across different source identifiers of this entity. A required string is present and non-empty.'
  - name: status
    type: enum
    nullable: false
    maps_to: contract.status
    allowed_values:
      - active
      - expired
      - terminated
    description: 'Contract status. No other value is valid.'
  - name: total_contract_value
    type: decimal
    nullable: false
    maps_to: contract.total_contract_value
    description: 'Signed agreement value. Not ARR and not the booking amount. Non-negative base-10 amount in US dollars with at most two fraction digits. The contract forbids a binary float. There is no currency field.'
  - name: start_date
    type: date
    nullable: false
    maps_to: contract.start_date
    description: 'Agreement start. ISO-8601 calendar date. No time and no timezone. Distinct from opportunity expected_close_date. Both may be present and they may differ.'
  - name: end_date
    type: date
    nullable: false
    maps_to: contract.end_date
    description: 'Agreement end. ISO-8601 calendar date. No time and no timezone. Greater than or equal to start_date.'
  - name: observed_at
    type: timestamp
    nullable: false
    maps_to: null
    description: 'Observation time. ISO-8601 timestamp in UTC. Part of the observation key with dealhub_contract_id. Downstream, a status, value, or term change starts a new contract version. The source row is not that canonical version.'
  - name: dealhub_quote_id
    type: string
    nullable: false
    maps_to: null
    description: 'The accepted quote. A required string is present and non-empty. Reference to the contract quote. One quote is cited by at most one contract.'
  - name: hubspot_deal_id
    type: string
    nullable: false
    maps_to: null
    description: 'The deal whose observation emits opportunity_won with opportunity_type new_business and stage closed_won. A required string is present and non-empty. Reference to the contract opportunity. One deal is cited by at most one contract.'
  - name: hubspot_company_id
    type: string
    nullable: false
    maps_to: null
    description: 'The firm. A required string is present and non-empty. Reference to the contract account.'
ingestion:
  - name: source_system
    type: enum
    nullable: false
    maps_to: null
    allowed_values:
      - dealhub
    description: 'Platform delivery metadata. The value equals the source_system of this file. The platform vocabulary is hubspot, dealhub, marketing, or product. This field is not a canonical business attribute and does not open a canonical Type 2 version by itself. It is not part of observation_key.'
  - name: delivery_id
    type: string
    nullable: false
    maps_to: null
    description: 'The extraction batch. A required string is present and non-empty. Many rows may share one delivery_id. A replay uses a new delivery_id and the same business attributes. Not a canonical business attribute and not part of observation_key.'
  - name: ingested_at
    type: timestamp
    nullable: false
    maps_to: null
    description: 'When this delivery was accepted. ISO-8601 timestamp in UTC. It may be later than observed_at, occurred_at, or booked_at. Late delivery is valid. Not a canonical business attribute and not part of observation_key.'
relationships:
  - field: dealhub_quote_id
    references: dealhub.quote.dealhub_quote_id
    required: true
    cardinality: 'At most one contract cites a given quote.'
  - field: hubspot_deal_id
    references: hubspot.deal.hubspot_deal_id
    required: true
    cardinality: 'At most one contract cites a given deal.'
  - field: hubspot_company_id
    references: hubspot.company.hubspot_company_id
    required: true
    cardinality: 'Many contracts may cite one company.'
events: []
rules:
  - 'Contract creation is judged on the observation that emits opportunity_won. That observation has opportunity_type new_business and stage closed_won. The hubspot_deal_id on the contract is that deal. A later observation of the same deal may change opportunity_type without removing the contract. A deal whose winning observation is expansion or renewal does not create a contract. The type that creates the contract is the type on that winning observation. A later deal observation, and the deal observation in effect at the observed_at of a later contract, leave that decision unchanged.'
  - 'The observation of a source identifier in effect at a timestamp is the row with that identifier whose observed_at is the latest at or before that timestamp. If no row of that identifier has observed_at at or before the timestamp, no observation is in effect, and a rule that requires one is not satisfied.'
  - 'The cited quote is the accepted quote of that deal.'
  - 'The company identifier matches the company on the cited deal and the cited quote.'
  - 'A later observation of the same dealhub_contract_id may change total_contract_value or end_date without removing the contract. That observation is not a second contract.'
  - 'end_date is greater than or equal to start_date.'
  - 'contract_number is stable across observations of the same dealhub_contract_id and unique across different dealhub_contract_id values.'
  - 'One quote is cited by at most one contract. One deal is cited by at most one contract.'
  - 'total_contract_value stays on this contract. It is not ARR and not the booking amount. This file does not annualize recurring_amount.'
  - 'This contract emits no lifecycle signal. Term and value changes are observations.'
  - 'start_date and opportunity expected_close_date are different fields.'
  - 'When a relationship value is present, it equals a source identifier defined by the referenced contract in the same dataset. Relationship fields store the parent source identifier. They do not embed the parent record.'
  - 'History is observation. A different payload at an existing observation_key is invalid. A business change is a new observed_at, and therefore a new observation_key. A replay is a new delivery_id for an existing observation_key whose business attributes match.'
  - 'Source identifiers are opaque non-empty strings. DealHub identifiers are expected to be prefixed strings. That shape is an assumption, not a rejection rule. A missing value is null, not an empty string. A required string is present and non-empty.'
  - 'source_system, delivery_id, and ingested_at are platform delivery metadata. They are not canonical business attributes, they do not open a canonical Type 2 version by themselves, and they are not part of observation_key. source_system equals dealhub. A replay uses a new delivery_id and the same business attributes. ingested_at may be later than the business timestamps on the row. Late delivery is valid.'
  - 'This contract does not contain canonical surrogate keys, surviving_account_id, surviving_contact_id, surviving_lead_id, surviving_opportunity_id, surviving_subscription_id, surviving_product_user_id, commercial_status, effective_start, effective_end, is_current, customer_converted, adoption_reached, or a lifecycle_event payload. It does not contain calculated ARR, net retention, pipeline coverage, win rate, or an adoption score, and it does not copy an amount from another source entity.'
