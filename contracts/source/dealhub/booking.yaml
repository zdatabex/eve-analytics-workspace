id: dealhub.booking
title: 'DealHub booking'
source_system: dealhub
source_entity: booking
canonical_entity: booking
history: immutable
grain: 'One row represents one recognized booking.'
source_identifier:
  - dealhub_booking_id
observation_key:
  - dealhub_booking_id
fields:
  - name: dealhub_booking_id
    type: string
    nullable: false
    maps_to: booking.dealhub_booking_id
    description: 'Opaque non-empty source identifier issued by the source system. Not a canonical surrogate key. The contract accepts any non-empty string and does not reject a value solely for its shape. DealHub identifiers are expected to be prefixed strings. That shape is an assumption, not a rejection rule.'
  - name: booking_number
    type: string
    nullable: false
    maps_to: booking.booking_number
    description: 'Required document number. Stable across observations of the same source identifier and unique across different source identifiers of this entity. A required string is present and non-empty.'
  - name: booking_type
    type: enum
    nullable: false
    maps_to: booking.booking_type
    allowed_values:
      - new_business
      - expansion
      - renewal
    description: 'Booking type. No other value is valid. booking_type classifies the economic event.'
  - name: booking_amount
    type: decimal
    nullable: false
    maps_to: booking.booking_amount
    description: 'Recognized booking amount. Not ARR and not the HubSpot deal amount. Not negative. Non-negative base-10 amount in US dollars with at most two fraction digits. The contract forbids a binary float. There is no currency field. Churn does not create a booking.'
  - name: booked_at
    type: timestamp
    nullable: false
    maps_to: booking.booked_at
    description: 'When the booking was recognized. ISO-8601 timestamp in UTC.'
  - name: hubspot_company_id
    type: string
    nullable: false
    maps_to: null
    description: 'The firm. A required string is present and non-empty. Reference to the booking account.'
  - name: hubspot_deal_id
    type: string
    nullable: false
    maps_to: null
    description: 'The deal. A required string is present and non-empty. Reference to the booking opportunity.'
  - name: dealhub_contract_id
    type: string
    nullable: false
    maps_to: null
    description: 'The contract. A required string is present and non-empty. Reference to the booking contract.'
  - name: dealhub_subscription_id
    type: string
    nullable: false
    maps_to: null
    description: 'The subscription. A required string is present and non-empty. Reference to the booking subscription.'
ingestion:
  - name: source_system
    type: enum
    nullable: false
    maps_to: null
    allowed_values:
      - dealhub
    description: 'Platform delivery metadata. The value equals the source_system of this file. The platform vocabulary is hubspot, dealhub, marketing, or product. This field is not a canonical business attribute and does not open a canonical Type 2 version by itself. It is not part of observation_key.'
  - name: delivery_id
    type: string
    nullable: false
    maps_to: null
    description: 'The extraction batch. A required string is present and non-empty. Many rows may share one delivery_id. A replay uses a new delivery_id and the same business attributes. Not a canonical business attribute and not part of observation_key.'
  - name: ingested_at
    type: timestamp
    nullable: false
    maps_to: null
    description: 'When this delivery was accepted. ISO-8601 timestamp in UTC. It may be later than observed_at, occurred_at, or booked_at. Late delivery is valid. Not a canonical business attribute and not part of observation_key.'
relationships:
  - field: hubspot_company_id
    references: hubspot.company.hubspot_company_id
    required: true
    cardinality: 'Many bookings may cite one company.'
  - field: hubspot_deal_id
    references: hubspot.deal.hubspot_deal_id
    required: true
    cardinality: 'Many bookings may cite one deal.'
  - field: dealhub_contract_id
    references: dealhub.contract.dealhub_contract_id
    required: true
    cardinality: 'Many bookings may cite one contract.'
  - field: dealhub_subscription_id
    references: dealhub.subscription.dealhub_subscription_id
    required: true
    cardinality: 'Many bookings may cite one subscription.'
events: []
rules:
  - 'History is immutable. observation_key is dealhub_booking_id. The contract has no observed_at. A correction or a distinct event is a new dealhub_booking_id. A second delivery of an existing identifier is a replay only when the business attributes match. A different payload does not rewrite the event.'
  - 'The row is the economic event. booking_type classifies it. There is no observed_at and no emitted_event.'
  - 'booking_type equals opportunity_type on the deal observation in effect at booked_at.'
  - 'The observation of a source identifier in effect at a timestamp is the row with that identifier whose observed_at is the latest at or before that timestamp. If no row of that identifier has observed_at at or before the timestamp, no observation is in effect, and a rule that requires one is not satisfied.'
  - 'The company identifier matches the company on the cited deal, contract, and subscription.'
  - 'Churn does not create a booking. booking_amount is not negative. Booking does not contain churn.'
  - 'booking_number is stable for this dealhub_booking_id and unique across different dealhub_booking_id values.'
  - 'booking_amount stays on this contract. It is not ARR and not the HubSpot deal amount.'
  - 'One deal, one contract, or one subscription may be cited by many bookings. All four parent fields are required.'
  - 'When a relationship value is present, it equals a source identifier defined by the referenced contract in the same dataset. Relationship fields store the parent source identifier. They do not embed the parent record.'
  - 'Source identifiers are opaque non-empty strings. DealHub identifiers are expected to be prefixed strings. That shape is an assumption, not a rejection rule. A missing value is null, not an empty string. A required string is present and non-empty.'
  - 'source_system, delivery_id, and ingested_at are platform delivery metadata. They are not canonical business attributes, they do not open a canonical Type 2 version by themselves, and they are not part of observation_key. source_system equals dealhub. A replay uses a new delivery_id and the same business attributes. ingested_at may be later than the business timestamps on the row. Late delivery is valid.'
  - 'This contract does not contain canonical surrogate keys, surviving_account_id, surviving_contact_id, surviving_lead_id, surviving_opportunity_id, surviving_subscription_id, surviving_product_user_id, commercial_status, effective_start, effective_end, is_current, customer_converted, adoption_reached, or a lifecycle_event payload. It does not contain calculated ARR, net retention, pipeline coverage, win rate, or an adoption score, and it does not copy an amount from another source entity.'
  - 'booked_at and ingested_at stay distinct. booked_at is UTC.'
