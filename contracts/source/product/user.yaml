id: product.user
title: 'Product user'
source_system: product
source_entity: user
canonical_entity: product_user
history: observation
grain: 'One row represents one observation of one product user at one observed_at.'
source_identifier:
  - product_user_source_id
observation_key:
  - product_user_source_id
  - observed_at
fields:
  - name: product_user_source_id
    type: string
    nullable: false
    maps_to: product_user.product_user_source_id
    description: 'Opaque non-empty source identifier issued by the source system. Not a canonical surrogate key. The contract accepts any non-empty string and does not reject a value solely for its shape. Product identifiers are expected to be opaque strings. That shape is an assumption, not a rejection rule.'
  - name: email_normalized
    type: string
    nullable: true
    maps_to: product_user.email_normalized
    description: 'Lowercase trimmed email when present. A missing value is null, not an empty string. Duplicate emails are valid, including at different firms. The contract does not merge them.'
  - name: status
    type: enum
    nullable: false
    maps_to: product_user.status
    allowed_values:
      - invited
      - active
      - inactive
    description: 'Product user status. No other value is valid. Status changes are observations. Product user status does not choose a lifecycle event.'
  - name: observed_at
    type: timestamp
    nullable: false
    maps_to: null
    description: 'Observation time. ISO-8601 timestamp in UTC. Part of the observation key with product_user_source_id. Downstream, a status, firm, or email change starts a new product-user version. The source row is not that canonical version.'
  - name: product_firm_id
    type: string
    nullable: false
    maps_to: null
    description: 'The tenant. A required string is present and non-empty. Reference to the product user account through product.firm.product_firm_id.'
ingestion:
  - name: source_system
    type: enum
    nullable: false
    maps_to: null
    allowed_values:
      - product
    description: 'Platform delivery metadata. The value equals the source_system of this file. The platform vocabulary is hubspot, dealhub, marketing, or product. This field is not a canonical business attribute and does not open a canonical Type 2 version by itself. It is not part of observation_key.'
  - name: delivery_id
    type: string
    nullable: false
    maps_to: null
    description: 'The extraction batch. A required string is present and non-empty. Many rows may share one delivery_id. A replay uses a new delivery_id and the same business attributes. Not a canonical business attribute and not part of observation_key.'
  - name: ingested_at
    type: timestamp
    nullable: false
    maps_to: null
    description: 'When this delivery was accepted. ISO-8601 timestamp in UTC. It may be later than observed_at, occurred_at, or booked_at. Late delivery is valid. Not a canonical business attribute and not part of observation_key.'
relationships:
  - field: product_firm_id
    references: product.firm.product_firm_id
    required: true
    cardinality: 'Many users may cite one firm.'
events: []
rules:
  - 'The contract does not include hubspot_contact_id. A matching contact is a downstream link. A product user email does not create a contact.'
  - 'The same email_normalized may appear on two product_user_source_id values, including at different firms. The contract does not merge them and does not contain a survivor link.'
  - 'The same product_user_source_id may cite a different product_firm_id on a later observation.'
  - 'A user without an email is valid and cannot match another user or a contact by email.'
  - 'email_normalized, when present, is lowercase and trimmed. Duplicate values across source identifiers are valid.'
  - 'Product user status does not choose a lifecycle event. This contract emits no lifecycle signal.'
  - 'Product users are not contacts and are not seats.'
  - 'When a relationship value is present, it equals a source identifier defined by the referenced contract in the same dataset. Relationship fields store the parent source identifier. They do not embed the parent record.'
  - 'History is observation. A different payload at an existing observation_key is invalid. A business change is a new observed_at, and therefore a new observation_key. A replay is a new delivery_id for an existing observation_key whose business attributes match.'
  - 'Source identifiers are opaque non-empty strings. Product identifiers are expected to be opaque strings. That shape is an assumption, not a rejection rule. A missing value is null, not an empty string. A required string is present and non-empty.'
  - 'source_system, delivery_id, and ingested_at are platform delivery metadata. They are not canonical business attributes, they do not open a canonical Type 2 version by themselves, and they are not part of observation_key. source_system equals product. A replay uses a new delivery_id and the same business attributes. ingested_at may be later than the business timestamps on the row. Late delivery is valid.'
  - 'This contract does not contain canonical surrogate keys, surviving_account_id, surviving_contact_id, surviving_lead_id, surviving_opportunity_id, surviving_subscription_id, surviving_product_user_id, commercial_status, effective_start, effective_end, is_current, customer_converted, adoption_reached, or a lifecycle_event payload. It does not contain calculated ARR, net retention, pipeline coverage, win rate, or an adoption score, and it does not copy an amount from another source entity.'
