id: product.outcome
title: 'Product outcome'
source_system: product
source_entity: outcome
canonical_entity: product_outcome
history: immutable
grain: 'One row represents one outcome of one product usage event.'
source_identifier:
  - product_outcome_source_id
observation_key:
  - product_outcome_source_id
fields:
  - name: product_outcome_source_id
    type: string
    nullable: false
    maps_to: product_outcome.product_outcome_source_id
    description: 'Opaque non-empty source identifier issued by the source system. Not a canonical surrogate key. The contract accepts any non-empty string and does not reject a value solely for its shape. Product identifiers are expected to be opaque strings. That shape is an assumption, not a rejection rule.'
  - name: occurred_at
    type: timestamp
    nullable: false
    maps_to: product_outcome.occurred_at
    description: 'When the outcome completed. ISO-8601 timestamp in UTC. occurred_at is at or after the occurred_at of the cited usage.'
  - name: outcome_type
    type: enum
    nullable: false
    maps_to: product_outcome.outcome_type
    allowed_values:
      - draft_completed
      - review_accepted
      - exported
    description: 'Outcome type. No other value is valid.'
  - name: product_usage_source_id
    type: string
    nullable: false
    maps_to: null
    description: 'The run. A required string is present and non-empty. Unique among outcomes. Reference to the outcome usage. At most one outcome cites a usage.'
  - name: product_user_source_id
    type: string
    nullable: false
    maps_to: null
    description: 'The login on that run. A required string is present and non-empty. Reference to the outcome product user. Equals the same field on the cited usage.'
  - name: product_firm_id
    type: string
    nullable: false
    maps_to: null
    description: 'The tenant on that run. A required string is present and non-empty. Reference to the outcome account. Equals the same field on the cited usage.'
  - name: product_workflow_id
    type: string
    nullable: false
    maps_to: null
    description: 'The capability on that run. A required string is present and non-empty. Reference to the outcome workflow. Equals the same field on the cited usage.'
ingestion:
  - name: source_system
    type: enum
    nullable: false
    maps_to: null
    allowed_values:
      - product
    description: 'Platform delivery metadata. The value equals the source_system of this file. The platform vocabulary is hubspot, dealhub, marketing, or product. This field is not a canonical business attribute and does not open a canonical Type 2 version by itself. It is not part of observation_key.'
  - name: delivery_id
    type: string
    nullable: false
    maps_to: null
    description: 'The extraction batch. A required string is present and non-empty. Many rows may share one delivery_id. A replay uses a new delivery_id and the same business attributes. Not a canonical business attribute and not part of observation_key.'
  - name: ingested_at
    type: timestamp
    nullable: false
    maps_to: null
    description: 'When this delivery was accepted. ISO-8601 timestamp in UTC. It may be later than observed_at, occurred_at, or booked_at. Late delivery is valid. Not a canonical business attribute and not part of observation_key.'
relationships:
  - field: product_usage_source_id
    references: product.usage.product_usage_source_id
    required: true
    cardinality: 'At most one outcome cites a given usage.'
  - field: product_user_source_id
    references: product.user.product_user_source_id
    required: true
    cardinality: 'Many outcomes may cite one product user.'
  - field: product_firm_id
    references: product.firm.product_firm_id
    required: true
    cardinality: 'Many outcomes may cite one firm.'
  - field: product_workflow_id
    references: product.ai_workflow.product_workflow_id
    required: true
    cardinality: 'Many outcomes may cite one workflow.'
events: []
rules:
  - 'History is immutable. observation_key is product_outcome_source_id. The contract has no observed_at. A correction or a distinct event is a new product_outcome_source_id. A second delivery of an existing identifier is a replay only when the business attributes match. A different payload does not rewrite the event.'
  - 'The row is the completed result. This contract has no emitted_event field. It does not contain adoption_reached, an adoption score, or a product-user adoption event.'
  - 'The first outcome of the account becomes canonical adoption_reached downstream. Adoption grain is one canonical event per account, derived from the first outcome. The alternative, one adoption event per product user, is not a source field.'
  - 'occurred_at is at or after the occurred_at of the cited usage.'
  - 'The user, firm, and workflow equal the same fields on the cited usage.'
  - 'At most one outcome cites a usage. product_usage_source_id is unique among outcomes.'
  - 'This contract has no observed_at.'
  - 'When a relationship value is present, it equals a source identifier defined by the referenced contract in the same dataset. Relationship fields store the parent source identifier. They do not embed the parent record.'
  - 'Source identifiers are opaque non-empty strings. Product identifiers are expected to be opaque strings. That shape is an assumption, not a rejection rule. A missing value is null, not an empty string. A required string is present and non-empty.'
  - 'source_system, delivery_id, and ingested_at are platform delivery metadata. They are not canonical business attributes, they do not open a canonical Type 2 version by themselves, and they are not part of observation_key. source_system equals product. A replay uses a new delivery_id and the same business attributes. ingested_at may be later than the business timestamps on the row. Late delivery is valid.'
  - 'This contract does not contain canonical surrogate keys, surviving_account_id, surviving_contact_id, surviving_lead_id, surviving_opportunity_id, surviving_subscription_id, surviving_product_user_id, commercial_status, effective_start, effective_end, is_current, customer_converted, adoption_reached, or a lifecycle_event payload. It does not contain calculated ARR, net retention, pipeline coverage, win rate, or an adoption score, and it does not copy an amount from another source entity.'
  - 'occurred_at and ingested_at stay distinct. occurred_at is UTC. The outcome timestamp is distinct from the occurred_at of the usage even when the values are equal.'
