id: marketing.campaign_performance
title: 'Marketing campaign performance'
source_system: marketing
source_entity: campaign_performance
canonical_entity: campaign_performance
history: immutable
grain: 'One row represents one campaign on one day.'
source_identifier:
  - marketing_campaign_id
  - performance_date
observation_key:
  - marketing_campaign_id
  - performance_date
fields:
  - name: marketing_campaign_id
    type: string
    nullable: false
    maps_to: null
    description: 'Campaign. A required string is present and non-empty. Part of the source identifier and the observation key. Reference to campaign.marketing_campaign_id. There is no separate performance document id.'
  - name: performance_date
    type: date
    nullable: false
    maps_to: campaign_performance.performance_date
    description: 'Delivery day. ISO-8601 calendar date. No time and no timezone. Part of the source identifier and the observation key.'
  - name: spend_amount
    type: decimal
    nullable: true
    maps_to: campaign_performance.spend_amount
    description: 'Spend for that day. Minimum 0 when present. Non-negative base-10 amount in US dollars with at most two fraction digits. The contract forbids a binary float. There is no currency field. A missing value is null, not an empty string. Null means the source did not report it. Null is not zero. This amount stays on this contract.'
  - name: impression_count
    type: integer
    nullable: true
    maps_to: campaign_performance.impression_count
    description: 'Whole number. Minimum 0 when present. A missing value is null, not an empty string. Null means the source did not report it. Null is not zero.'
  - name: click_count
    type: integer
    nullable: true
    maps_to: campaign_performance.click_count
    description: 'Whole number. Minimum 0 when present. A missing value is null, not an empty string. Null means the source did not report it. Null is not zero. The contract does not require click_count to be less than or equal to impression_count.'
ingestion:
  - name: source_system
    type: enum
    nullable: false
    maps_to: null
    allowed_values:
      - marketing
    description: 'Platform delivery metadata. The value equals the source_system of this file. The platform vocabulary is hubspot, dealhub, marketing, or product. This field is not a canonical business attribute and does not open a canonical Type 2 version by itself. It is not part of observation_key.'
  - name: delivery_id
    type: string
    nullable: false
    maps_to: null
    description: 'The extraction batch. A required string is present and non-empty. Many rows may share one delivery_id. A replay uses a new delivery_id and the same business attributes. Not a canonical business attribute and not part of observation_key.'
  - name: ingested_at
    type: timestamp
    nullable: false
    maps_to: null
    description: 'When this delivery was accepted. ISO-8601 timestamp in UTC. It may be later than observed_at, occurred_at, or booked_at. Late delivery is valid. Not a canonical business attribute and not part of observation_key.'
relationships:
  - field: marketing_campaign_id
    references: marketing.campaign.marketing_campaign_id
    required: true
    cardinality: 'One campaign has many days.'
events: []
rules:
  - 'observation_key is marketing_campaign_id plus performance_date. The contract has no observed_at. One row is one campaign-day. A second delivery of the same pair with the same measures is a replay. A second delivery that changes the measures replaces that campaign-day. It does not create a second row.'
  - 'Null on a measure means the source did not report it. Null is not zero.'
  - 'The contract does not require click_count to be less than or equal to impression_count. Marketing measures are independently nullable.'
  - 'There is no separate performance document id. source_identifier and observation_key are marketing_campaign_id together with performance_date.'
  - 'spend_amount stays on this contract. It is not a HubSpot amount or a DealHub amount.'
  - 'This contract emits no lifecycle signal and has no observed_at.'
  - 'When a relationship value is present, it equals a source identifier defined by the referenced contract in the same dataset. Relationship fields store the parent source identifier. They do not embed the parent record.'
  - 'Source identifiers are opaque non-empty strings. Marketing identifiers are expected to be opaque strings. That shape is an assumption, not a rejection rule. A missing value is null, not an empty string. A required string is present and non-empty.'
  - 'source_system, delivery_id, and ingested_at are platform delivery metadata. They are not canonical business attributes, they do not open a canonical Type 2 version by themselves, and they are not part of observation_key. source_system equals marketing. A replay uses a new delivery_id and the same business attributes. ingested_at may be later than the business timestamps on the row. Late delivery is valid.'
  - 'This contract does not contain canonical surrogate keys, surviving_account_id, surviving_contact_id, surviving_lead_id, surviving_opportunity_id, surviving_subscription_id, surviving_product_user_id, commercial_status, effective_start, effective_end, is_current, customer_converted, adoption_reached, or a lifecycle_event payload. It does not contain calculated ARR, net retention, pipeline coverage, win rate, or an adoption score, and it does not copy an amount from another source entity.'
  - 'performance_date is a calendar date with no time and no timezone. It is distinct from ingested_at.'
