id: hubspot.company
title: 'HubSpot company'
source_system: hubspot
source_entity: company
canonical_entity: account
history: observation
grain: 'One row represents one observation of one HubSpot company at one observed_at.'
source_identifier:
  - hubspot_company_id
observation_key:
  - hubspot_company_id
  - observed_at
fields:
  - name: hubspot_company_id
    type: string
    nullable: false
    maps_to: account.hubspot_company_id
    description: 'Opaque non-empty source identifier issued by the source system. Not a canonical surrogate key. The contract accepts any non-empty string and does not reject a value solely for its shape. HubSpot identifiers are expected to be numeric strings. That shape is an assumption, not a rejection rule.'
  - name: firm_name
    type: string
    nullable: false
    maps_to: account.firm_name
    description: 'Display name. A required string is present and non-empty.'
  - name: primary_domain
    type: string
    nullable: true
    maps_to: account.primary_domain
    description: 'Lowercase host when present, with no scheme and no path. A missing value is null, not an empty string. Duplicate domains across companies are valid. The contract does not deduplicate them.'
  - name: state
    type: string
    nullable: true
    maps_to: account.state
    description: 'Principal US state. Open text, not a closed list of postal codes. A missing value is null, not an empty string.'
  - name: segment
    type: enum
    nullable: true
    maps_to: account.segment
    allowed_values:
      - solo
      - small
      - mid
      - large
    description: 'Firm segment. No other value is valid. A missing value is null, not an empty string.'
  - name: practice_focus
    type: string
    nullable: true
    maps_to: account.practice_focus
    description: 'Open catalog of practice focus. Not a closed vocabulary. A missing value is null, not an empty string.'
  - name: icp_fit
    type: enum
    nullable: true
    maps_to: account.icp_fit
    allowed_values:
      - in_icp
      - out_of_icp
    description: 'ICP fit. No other value is valid. A missing value is null, not an empty string.'
  - name: owner_name
    type: string
    nullable: true
    maps_to: account.owner_name
    description: 'Firm-relationship owner. A name, not an employee identifier. Open text. Independent of the deal owner_name. A missing value is null, not an empty string.'
  - name: hubspot_lifecycle_stage
    type: string
    nullable: true
    maps_to: account.hubspot_lifecycle_stage
    description: 'Source lifecycle label stored unchanged. Open text. Not the canonical commercial_status enum and not constrained to prospect, customer, or former_customer. A missing value is null, not an empty string.'
  - name: observed_at
    type: timestamp
    nullable: false
    maps_to: null
    description: 'Observation time. ISO-8601 timestamp in UTC. Part of the observation key with hubspot_company_id. Downstream, this time starts a new account version when a tracked firmographic changes. The source row is not that canonical version.'
ingestion:
  - name: source_system
    type: enum
    nullable: false
    maps_to: null
    allowed_values:
      - hubspot
    description: 'Platform delivery metadata. The value equals the source_system of this file. The platform vocabulary is hubspot, dealhub, marketing, or product. This field is not a canonical business attribute and does not open a canonical Type 2 version by itself. It is not part of observation_key.'
  - name: delivery_id
    type: string
    nullable: false
    maps_to: null
    description: 'The extraction batch. A required string is present and non-empty. Many rows may share one delivery_id. A replay uses a new delivery_id and the same business attributes. Not a canonical business attribute and not part of observation_key.'
  - name: ingested_at
    type: timestamp
    nullable: false
    maps_to: null
    description: 'When this delivery was accepted. ISO-8601 timestamp in UTC. It may be later than observed_at, occurred_at, or booked_at. Late delivery is valid. Not a canonical business attribute and not part of observation_key.'
relationships: []
events: []
rules:
  - 'Two companies may share primary_domain or firm_name. The contract does not deduplicate them.'
  - 'A missing primary_domain is valid. It does not match a Product firm.'
  - 'hubspot_lifecycle_stage may disagree with any later canonical commercial status. The contract stores the HubSpot label unchanged. It is an unconstrained source label and is not canonical commercial_status.'
  - 'primary_domain, when present, is a lowercase host with no scheme and no path. Duplicate primary_domain values across source identifiers are valid.'
  - 'This contract has no relationships. It does not store a Product firm identifier.'
  - 'This contract emits no lifecycle signal.'
  - 'History is observation. A different payload at an existing observation_key is invalid. A business change is a new observed_at, and therefore a new observation_key. A replay is a new delivery_id for an existing observation_key whose business attributes match.'
  - 'Source identifiers are opaque non-empty strings. HubSpot identifiers are expected to be numeric strings. That shape is an assumption, not a rejection rule. A missing value is null, not an empty string. A required string is present and non-empty.'
  - 'source_system, delivery_id, and ingested_at are platform delivery metadata. They are not canonical business attributes, they do not open a canonical Type 2 version by themselves, and they are not part of observation_key. source_system equals hubspot. A replay uses a new delivery_id and the same business attributes. ingested_at may be later than the business timestamps on the row. Late delivery is valid.'
  - 'This contract does not contain canonical surrogate keys, surviving_account_id, surviving_contact_id, surviving_lead_id, surviving_opportunity_id, surviving_subscription_id, surviving_product_user_id, commercial_status, effective_start, effective_end, is_current, customer_converted, adoption_reached, or a lifecycle_event payload. It does not contain calculated ARR, net retention, pipeline coverage, win rate, or an adoption score, and it does not copy an amount from another source entity.'
  - 'Timestamps stay distinct. observed_at is the observation time and ingested_at is delivery time. observed_at is UTC.'
