id: hubspot.deal
title: 'HubSpot deal'
source_system: hubspot
source_entity: deal
canonical_entity: opportunity
history: observation
grain: 'One row represents one observation of one HubSpot deal at one observed_at.'
source_identifier:
  - hubspot_deal_id
observation_key:
  - hubspot_deal_id
  - observed_at
fields:
  - name: hubspot_deal_id
    type: string
    nullable: false
    maps_to: opportunity.hubspot_deal_id
    description: 'Opaque non-empty source identifier issued by the source system. Not a canonical surrogate key. The contract accepts any non-empty string and does not reject a value solely for its shape. HubSpot identifiers are expected to be numeric strings. That shape is an assumption, not a rejection rule.'
  - name: opportunity_name
    type: string
    nullable: false
    maps_to: opportunity.opportunity_name
    description: 'Deal name. A required string is present and non-empty. Two deals for one company stay two deals when their hubspot_deal_id values differ, even when the names match.'
  - name: opportunity_type
    type: enum
    nullable: false
    maps_to: opportunity.opportunity_type
    allowed_values:
      - new_business
      - expansion
      - renewal
    description: 'Opportunity type as of the observed_at on this observation. A later observation of the same deal may change it. No other value is valid.'
  - name: stage
    type: enum
    nullable: false
    maps_to: opportunity.stage
    allowed_values:
      - discovery
      - evaluation
      - proposal
      - negotiation
      - closed_won
      - closed_lost
    description: 'Opportunity stage. No other value is valid.'
  - name: amount
    type: decimal
    nullable: true
    maps_to: opportunity.amount
    description: 'HubSpot-entered amount. Not bookings and not ARR. Null is an unreported amount, not zero. Non-negative base-10 amount in US dollars with at most two fraction digits. The contract forbids a binary float. There is no currency field.'
  - name: expected_close_date
    type: date
    nullable: true
    maps_to: opportunity.expected_close_date
    description: 'Sales expectation. Not a contract start. ISO-8601 calendar date. No time and no timezone. A missing value is null, not an empty string. This field and contract start_date may both be present and they may differ.'
  - name: owner_name
    type: string
    nullable: true
    maps_to: opportunity.owner_name
    description: 'Deal owner. A name, not an employee identifier. Independent of the company owner. Open text. A missing value is null, not an empty string. Company owner_name and this field may both be present and they may differ.'
  - name: forecast_category
    type: enum
    nullable: true
    maps_to: opportunity.forecast_category
    allowed_values:
      - pipeline
      - best_case
      - commit
      - closed
      - omitted
    description: 'Forecast category. No other value is valid. A missing value is null, not an empty string.'
  - name: created_at
    type: timestamp
    nullable: false
    maps_to: opportunity.created_at
    description: 'When the deal opened. ISO-8601 timestamp in UTC. Stable across observations of this deal.'
  - name: observed_at
    type: timestamp
    nullable: false
    maps_to: null
    description: 'Observation time. ISO-8601 timestamp in UTC. At or after created_at. The opening observation sets observed_at equal to created_at. Downstream, a tracked deal attribute change starts a new opportunity version. The source row is not that canonical version.'
  - name: emitted_event
    type: enum
    nullable: true
    maps_to: null
    allowed_values:
      - opportunity_opened
      - opportunity_stage_changed
      - opportunity_won
      - opportunity_lost
    description: 'Lifecycle signal chosen by this observation. Downstream this chooses lifecycle_event.event_name. Null when a later observation does not change stage. This contract does not emit customer_converted and does not contain a lifecycle_event payload. A missing value is null, not an empty string.'
  - name: hubspot_company_id
    type: string
    nullable: false
    maps_to: null
    description: 'The firm. A required string is present and non-empty. Stable across observations of this deal. Reference to the opportunity account.'
  - name: hubspot_contact_id
    type: string
    nullable: true
    maps_to: null
    description: 'Primary contact. Reference to the opportunity primary contact. A missing value is null, not an empty string.'
  - name: hubspot_lead_id
    type: string
    nullable: true
    maps_to: null
    description: 'Originating lead. Stable when present. Reference to lead.hubspot_lead_id. A missing value is null, not an empty string. At most one deal cites a given lead.'
  - name: dealhub_subscription_id
    type: string
    nullable: true
    maps_to: null
    description: 'Targeted subscription. On this observation, required when opportunity_type is expansion or renewal, and null when opportunity_type is new_business. Reference to the targeted subscription. This observation does not create a subscription.'
ingestion:
  - name: source_system
    type: enum
    nullable: false
    maps_to: null
    allowed_values:
      - hubspot
    description: 'Platform delivery metadata. The value equals the source_system of this file. The platform vocabulary is hubspot, dealhub, marketing, or product. This field is not a canonical business attribute and does not open a canonical Type 2 version by itself. It is not part of observation_key.'
  - name: delivery_id
    type: string
    nullable: false
    maps_to: null
    description: 'The extraction batch. A required string is present and non-empty. Many rows may share one delivery_id. A replay uses a new delivery_id and the same business attributes. Not a canonical business attribute and not part of observation_key.'
  - name: ingested_at
    type: timestamp
    nullable: false
    maps_to: null
    description: 'When this delivery was accepted. ISO-8601 timestamp in UTC. It may be later than observed_at, occurred_at, or booked_at. Late delivery is valid. Not a canonical business attribute and not part of observation_key.'
relationships:
  - field: hubspot_company_id
    references: hubspot.company.hubspot_company_id
    required: true
    cardinality: 'Many deals may cite one company.'
  - field: hubspot_contact_id
    references: hubspot.contact.hubspot_contact_id
    required: false
    cardinality: 'Many deals may cite one contact.'
  - field: hubspot_lead_id
    references: hubspot.lead.hubspot_lead_id
    required: false
    cardinality: 'At most one deal cites a given lead.'
  - field: dealhub_subscription_id
    references: dealhub.subscription.dealhub_subscription_id
    required: false
    requirement: 'On this observation, required when opportunity_type is expansion or renewal, and null when opportunity_type is new_business.'
    cardinality: 'Many deals may cite one subscription.'
events:
  - signal: opportunity_opened
    condition: 'The creation observation, with stage discovery. One per deal. observed_at equals created_at.'
  - signal: opportunity_stage_changed
    condition: 'stage becomes evaluation, proposal, or negotiation.'
  - signal: opportunity_won
    condition: 'stage becomes closed_won. At most one per deal.'
  - signal: opportunity_lost
    condition: 'stage becomes closed_lost. At most one per deal.'
  - signal: none
    condition: 'A later observation whose stage is unchanged. emitted_event is null. Amount, close date, owner, forecast, and opportunity_type may still change. The observation carries the type as of its observed_at.'
rules:
  - 'A deal is not both won and lost.'
  - 'Opening at discovery is opportunity_opened, not opportunity_stage_changed.'
  - 'One opportunity_opened exists for each deal. opportunity_won and opportunity_lost are mutually exclusive and each occurs at most once per deal.'
  - 'Each observation carries opportunity_type as of observed_at. On an observation whose type is new_business, dealhub_subscription_id is null. On an observation whose type is expansion or renewal, dealhub_subscription_id is required and cites an existing subscription. That observation does not create a subscription.'
  - 'When hubspot_contact_id is present, the contact observation in effect at the observed_at of the deal has the same hubspot_company_id as the deal.'
  - 'When dealhub_subscription_id is present, the hubspot_company_id on that subscription equals the hubspot_company_id on the deal.'
  - 'The observation of a source identifier in effect at a timestamp is the row with that identifier whose observed_at is the latest at or before that timestamp. If no row of that identifier has observed_at at or before the timestamp, no observation is in effect, and a rule that requires one is not satisfied.'
  - 'amount may be null. Null is an unreported amount, not zero. HubSpot amount stays on this contract. It is not bookings and not ARR.'
  - 'The deal contract does not emit customer_converted. The first win for the account becomes that canonical event downstream.'
  - 'Two deals for one company are two deals when their hubspot_deal_id values differ, even when the names match.'
  - 'A deal may omit its contact, lead, amount, close date, and forecast. hubspot_company_id remains required.'
  - 'created_at is stable across observations. hubspot_company_id is stable across observations of this deal. hubspot_lead_id is stable when present. observed_at is at or after created_at. The opening observation sets them equal.'
  - 'expected_close_date and a contract start_date are different fields. owner_name on this deal and owner_name on the company are different fields.'
  - 'A deal comes from at most one lead.'
  - 'When a relationship value is present, it equals a source identifier defined by the referenced contract in the same dataset. Relationship fields store the parent source identifier. They do not embed the parent record.'
  - 'History is observation. A different payload at an existing observation_key is invalid. A business change is a new observed_at, and therefore a new observation_key. A replay is a new delivery_id for an existing observation_key whose business attributes match.'
  - 'Source identifiers are opaque non-empty strings. HubSpot identifiers are expected to be numeric strings. That shape is an assumption, not a rejection rule. A missing value is null, not an empty string. A required string is present and non-empty.'
  - 'source_system, delivery_id, and ingested_at are platform delivery metadata. They are not canonical business attributes, they do not open a canonical Type 2 version by themselves, and they are not part of observation_key. source_system equals hubspot. A replay uses a new delivery_id and the same business attributes. ingested_at may be later than the business timestamps on the row. Late delivery is valid.'
  - 'This contract does not contain canonical surrogate keys, surviving_account_id, surviving_contact_id, surviving_lead_id, surviving_opportunity_id, surviving_subscription_id, surviving_product_user_id, commercial_status, effective_start, effective_end, is_current, customer_converted, adoption_reached, or a lifecycle_event payload. It does not contain calculated ARR, net retention, pipeline coverage, win rate, or an adoption score, and it does not copy an amount from another source entity.'
  - 'Creation, observation, expected close date, and ingestion stay distinct. Dates have no time. Timestamps are UTC.'
